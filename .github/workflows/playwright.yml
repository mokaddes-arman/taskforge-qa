name: Playwright QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The postinstall hook downloads all browsers. The E2E job installs
          # only the browser it needs, so skip the download here.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Type check
        run: npm run typecheck

      # Report redaction (QA-018) must never regress: secrets are masked in
      # every report this public repository uploads.
      - name: Unit tests (report redaction)
        run: npm run test:unit

  e2e:
    name: E2E (Chrome)
    needs: typecheck
    # Fork pull requests do not receive repository secrets, so only run the
    # credential-backed suite for same-repository PRs, pushes and manual runs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://mytaskforge.net/' }}
      WORKSPACE_PATH: ${{ secrets.WORKSPACE_PATH || '/abdul-s-workspace' }}
      owner_email: ${{ secrets.OWNER_EMAIL }}
      owner_password: ${{ secrets.OWNER_PASSWORD }}
      # Optional RBAC suite (tests/20-*, project roles-chrome). Runs only when
      # the RUN_RBAC repository variable is 'true' and these secrets are set.
      # Off by default: failure snapshots of the platform admin console would
      # list user e-mails in the artifacts of this public repository.
      RUN_RBAC: ${{ vars.RUN_RBAC }}
      super_admin: ${{ secrets.SUPER_ADMIN }}
      super_admin_password: ${{ secrets.SUPER_ADMIN_PASSWORD }}
      qa_admin_email: ${{ secrets.QA_ADMIN_EMAIL }}
      qa_manager_email: ${{ secrets.QA_MANAGER_EMAIL }}
      qa_employee_email: ${{ secrets.QA_EMPLOYEE_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Verify test credentials are configured
        shell: bash
        run: |
          if [[ -z "${owner_email}" || -z "${owner_password}" ]]; then
            echo "::error::Set the OWNER_EMAIL and OWNER_PASSWORD repository secrets before running the E2E job."
            exit 1
          fi

      # One invocation so the HTML report, dashboard and bug report cover the
      # auth, module (and optional RBAC) projects together; setup projects run
      # as dependencies. Workers default to 2 on CI; override with the WORKERS
      # repository variable.
      - name: Run Playwright tests (auth + modules [+ RBAC], Chrome)
        shell: bash
        run: |
          projects=(--project=auth-chrome --project=modules-chrome)
          if [[ "${RUN_RBAC}" == "true" ]]; then
            if [[ -z "${super_admin}" || -z "${super_admin_password}" || -z "${qa_admin_email}" || -z "${qa_manager_email}" || -z "${qa_employee_email}" ]]; then
              echo "::error::RUN_RBAC is true but SUPER_ADMIN, SUPER_ADMIN_PASSWORD or QA_*_EMAIL secrets are missing."
              exit 1
            fi
            projects+=(--project=roles-chrome)
          fi
          npx playwright test "${projects[@]}"
        env:
          WORKERS: ${{ vars.WORKERS }}

      - name: Publish bug report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f dashboard-report/bug-report.md ]]; then
            cat dashboard-report/bug-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload dashboard and bug report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-report
          path: dashboard-report/
          if-no-files-found: ignore
          retention-days: 14
